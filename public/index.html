<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Penalti Stars</title>
  <meta name="description" content="Colecciona futbolistas, abre sobres y gana tandas de penaltis online contra tus amigos.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/cards.css">
</head>
<body>
  <div class="stadium-bg" aria-hidden="true"><div class="lights"></div><div class="grass"></div></div>

  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/inicio"><span class="brand-ball">⚽</span><span>PENALTI<b>STARS</b></span></a>
    <nav class="nav" id="nav">
      <a href="#/inicio" data-nav="inicio"><span>🏠</span>Inicio</a>
      <a href="#/sala" data-nav="sala"><span>🎮</span>Jugar</a>
      <a href="#/coleccion" data-nav="coleccion"><span>🃏</span>Colección</a>
      <a href="#/tienda" data-nav="tienda"><span>🛒</span>Tienda</a>
      <a href="#/picks" data-nav="picks"><span>🎁</span>Picks<i class="badge" id="picks-badge" hidden></i></a>
      <a href="#/clasificacion" data-nav="clasificacion"><span>🏆</span>Ranking</a>
      <a href="#/admin" data-nav="admin" id="nav-admin" hidden><span>🛡️</span>Admin</a>
    </nav>
    <div class="user-chip">
      <button class="icon-btn" id="mute-btn" title="Sonido">🔊</button>
      <span class="coins" id="coins-chip">🪙 0</span>
      <a class="me-link" href="#/perfil" id="me-link"></a>
    </div>
  </header>

  <main id="app" class="app"></main>

  <div id="overlay-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
